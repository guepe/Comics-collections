name: release

# Crée la GitHub Release à chaque tag de version (posé par tools/release.py).
# Les notes de release sont le message du tag annoté (entrées de CHANGE.md depuis le tag précédent).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-from-tag --title "${GITHUB_REF_NAME}"
