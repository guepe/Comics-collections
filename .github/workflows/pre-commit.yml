name: pre-commit

on:
  push:
    branches: ["19.0", "19.0-dev"]
  pull_request:
    branches: ["19.0", "19.0-dev"]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
